name: Daily hedgehog quote

on:
  schedule:
    # 01:45 UTC = 07:15 IST. GitHub often starts scheduled jobs late, so this
    # leaves room before the 08:10-08:45 IST posting window; the job then
    # sleeps until the day's slot.
    - cron: "45 1 * * *"
  workflow_dispatch:
    inputs:
      post_now:
        description: "Post immediately instead of waiting for today's time slot"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-hedgehog
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: hedgehog_posts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generate today's images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
        run: python run_daily.py prepare

      # Instagram downloads images by URL, so they are pushed to this public
      # repo first and served from raw.githubusercontent.com.
      - name: Commit images
        id: commit
        run: |
          git config user.name "hedgehog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts state.json
          git diff --cached --quiet || git commit -m "Prepare hedgehog post for $(TZ=Asia/Kolkata date +%F)"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post to Instagram and LinkedIn
        env:
          PUBLIC_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.commit.outputs.sha }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION }}
        run: python run_daily.py publish ${{ inputs.post_now && '--now' || '' }}

      - name: Record what was posted
        if: always() && steps.commit.outcome == 'success'
        run: |
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "Record hedgehog post for $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase && git push
